server:
  port: 0

spring:
  application:
    name: vetledger-ai-backend-test
  
  datasource:
    url: jdbc:h2:mem:vetledgertest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

vetledger:
  ai:
    gemini-api-key: ""
    model: gemini-1.5-flash
    timeout-ms: 3000
  surveillance:
    default-window-days: 14
    min-affected-animals: 5
    min-affected-farms: 3
    baseline-elevation-threshold: 2.0
