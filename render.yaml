services:
  - type: web
    name: vetledger-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: vetledger-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: vetledger-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: vetledger-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: vetledger-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: vetledger-db
          property: password
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: vetledger-db
    databaseName: vetledger_ai
    user: vetledger
    plan: free
    region: oregon
